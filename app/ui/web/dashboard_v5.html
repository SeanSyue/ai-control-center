<!DOCTYPE html>
<html lang="zh-Hant" data-mode="night">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' qrc:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICC — Dashboard v5（分組收合版）</title>
<link rel="stylesheet" href="aicc.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;user-select:none;transition:background .35s}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35}
.mono{font-family:"SF Mono",Consolas,monospace}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}

.fabric{background-color:var(--plaid-base);
  background-image:
    repeating-linear-gradient(90deg,var(--plaid-dark) 0 4px,transparent 4px 13px,var(--plaid-line) 13px 17px,transparent 17px 26px,var(--plaid-dark) 26px 32px,transparent 32px 48px),
    repeating-linear-gradient(0deg, var(--plaid-dark) 0 4px,transparent 4px 13px,var(--plaid-line) 13px 17px,transparent 17px 26px,var(--plaid-dark) 26px 32px,transparent 32px 48px),
    repeating-linear-gradient(90deg,var(--plaid-gold) 0 1.5px,transparent 1.5px 96px),
    repeating-linear-gradient(0deg, var(--plaid-gold) 0 1.5px,transparent 1.5px 96px)}
.fabric-aqua{--plaid-base:#1E6E9E;--plaid-line:rgba(255,255,255,.28)}
.fabric-gold{--plaid-base:#7A6330;--plaid-line:rgba(255,240,200,.28)}

/* 側邊欄已移到 shell.js（六頁共用），這裡只剩內容區與右欄 */
.app{display:grid;grid-template-columns:1fr 288px;min-height:100vh}
@media(max-width:1180px){.app{grid-template-columns:1fr}.rail{display:none}}

.main{padding:0 0 44px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:20px 30px;border-bottom:1px solid var(--line-soft);background:var(--panel);position:sticky;top:0;z-index:30}
.topbar h1{font-size:1.22rem}
.topbar .sub{color:var(--text-3);font-size:.78rem;font-weight:600}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:9px 20px;font-family:inherit;font-weight:800;font-size:.8rem;
  color:#fff;background:var(--grad-btn);box-shadow:var(--glow);cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.q{background:transparent;color:var(--text-2);box-shadow:none;border:1px solid var(--line)}
.btn.q:hover{border-color:var(--aqua);color:var(--aqua)}
.btn.gold{background:linear-gradient(115deg,var(--gold),var(--rose));color:#2A1A00;box-shadow:var(--glow-gold)}
.btn.sm{padding:7px 15px;font-size:.75rem;border-radius:11px}

/* ===== 星軌泳道（與 v4 相同）===== */
.sky{margin:22px 30px 0;border-radius:20px;overflow:hidden;border:1px solid var(--line-soft);box-shadow:var(--shadow)}
.sky .hd{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:13px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.sky .hd b{font-size:.88rem}
.sky .hd .how{display:flex;gap:18px;flex-wrap:wrap;font-size:.72rem;color:var(--text-3);font-weight:600}
.sky .hd .how i{font-style:normal;color:var(--text-2)}
.plot{background:var(--sky);display:grid;grid-template-columns:112px 1fr}
@media(max-width:700px){.plot{grid-template-columns:86px 1fr}}
.lane-name{height:64px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:.76rem;font-weight:800;
  border-bottom:1px solid var(--line-soft);color:var(--text-2);border-right:1px solid var(--line-soft)}
.lane-name .k{width:8px;height:8px;border-radius:50%;flex:none}
.lane-name.gate{color:var(--gold)} .lane-name.gate .k{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.lane-name.run{color:var(--aqua)}  .lane-name.run .k{background:var(--aqua);box-shadow:0 0 10px var(--aqua)}
.lane-name.idle{color:var(--text-3)} .lane-name.idle .k{background:var(--text-3)}
.lane-name.axis{height:34px;border-bottom:0;color:var(--text-3);font-size:.68rem;letter-spacing:.08em}
.lane{position:relative;height:64px;border-bottom:1px solid var(--line-soft)}
.lane.gate{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.lane.run{background:color-mix(in srgb,var(--aqua) 6%,transparent)}
.gl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--grid)}
.gl.now{border-left:2px solid var(--aqua);box-shadow:0 0 14px var(--aqua);opacity:.85}
.coldzone{position:absolute;top:0;bottom:0;left:0;width:31%;background:var(--cold)}
.star{position:absolute;top:50%;transform:translate(-50%,-50%);width:1px;height:1px;z-index:5;cursor:pointer}
.star .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;color:var(--text-2)}
.star .core svg{display:block;width:100%;height:100%}
.star .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;pointer-events:none}
.star .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;opacity:.5}
.star.run{color:var(--aqua)}
.star.run .core{width:16px;height:16px;color:var(--aqua);filter:drop-shadow(0 0 8px var(--aqua));animation:bt 1.9s ease-in-out infinite}
.star.run .halo{background:radial-gradient(circle,color-mix(in srgb,var(--aqua) 40%,transparent),transparent 70%)}
.star.gate{color:var(--gold)}
.star.gate .core{width:17px;height:17px;color:var(--gold);filter:drop-shadow(0 0 9px var(--gold));animation:bt 2.5s ease-in-out infinite}
.star.gate .halo{background:radial-gradient(circle,color-mix(in srgb,var(--gold) 42%,transparent),transparent 70%)}
.star.idle{color:var(--text-3)}
.star.idle .core{width:10px;height:10px;opacity:.7}
/* 要你處理：**落在「等你決策」那條泳道，但不跳。**
   跳動 = 「AI 還在線上等你回一句話」，而這一種沒有人在等——
   它是「跑完了，有一件事等你動手」。`outcomes.WAITING_GROUPS` 只留給前者。
   2026-08-24 之前這 16 種收場全部畫成灰色的「閒置」。 */
.star.gate.needs_you .core{animation:none;color:var(--gold);opacity:.9;
  filter:drop-shadow(0 0 5px var(--gold))}
.star.error{color:var(--rose)}
.star.error .core{color:var(--rose);opacity:.95;filter:drop-shadow(0 0 6px var(--rose))}
.star.done .core{color:var(--mint);opacity:.85}
.star.unpaired .ring{display:none}
@keyframes bt{0%,100%{transform:translate(-50%,-50%) scale(.86) rotate(0)}50%{transform:translate(-50%,-50%) scale(1.14) rotate(18deg)}}
.star .lbl{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.76rem;font-weight:700;color:var(--text);pointer-events:none}
.star .lbl.l{right:22px;text-align:right} .star .lbl.r{left:22px}
.star .lbl small{display:block;font-weight:600;font-size:.66rem;color:var(--text-3)}
.star .tip{position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(6px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:212px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s;z-index:20}
.star:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.star:hover{z-index:30}
.star .tip b{display:block;font-size:.84rem;margin-bottom:5px}
.star .tip .kv{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--text-3);padding:2px 0}
.star .tip .kv span:last-child{color:var(--text-2);font-weight:700}
.axis{position:relative;height:34px}
.axis .tk{position:absolute;top:7px;transform:translateX(-50%);font-size:.68rem;color:var(--text-3);white-space:nowrap}
.axis .tk.now{color:var(--aqua);font-weight:800}
.coldlabel{position:absolute;left:12px;top:8px;font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--text-3);opacity:.85;z-index:6}

/* ===== 分組（v5 新增）===== */
.groups{padding:28px 30px 0;display:flex;flex-direction:column;gap:34px}
.grp{border-radius:18px}

/* 群組標題 */
.ghd{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;transition:.2s}

/* 等你決策：標題本身就是金色緞帶（原本的獨立橫幅已移除）*/
.grp.gate .ghd{padding:13px 26px;color:#2A1A00;font-weight:800;
  background:linear-gradient(110deg,var(--gold),#FFC0D4);
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 50%,100% 100%,0 100%,18px 50%);
  box-shadow:var(--glow-gold)}
.grp.gate.flash .ghd{animation:flash 1.1s ease-out 2}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.grp.gate .ghd .sum{color:rgba(42,26,0,.66)}
.grp.gate .ghd .cnt{background:rgba(27,16,48,.82);color:#FFE9B8}

/* 執行中／閒置：一般標題列 */
.grp.run .ghd,.grp.idle .ghd{padding:11px 18px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px}
.grp.run .ghd{border-left:3px solid var(--aqua)}
.grp.idle .ghd{border-left:3px solid var(--text-3);opacity:.9}
.grp.run .ghd:hover,.grp.idle .ghd:hover{border-color:var(--line)}

.ghd .chev{width:16px;height:16px;flex:none;transition:transform .22s}
.grp.open .ghd .chev{transform:rotate(90deg)}
.ghd .ttl{font-size:.92rem;font-weight:800}
.ghd .cnt{font-size:.68rem;font-weight:800;padding:2px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--text-3) 22%,transparent);color:var(--text-2)}
.grp.run .ghd .cnt{background:var(--grad-btn);color:#fff}
.ghd .sum{margin-left:auto;font-size:.76rem;color:var(--text-3);font-weight:600;text-align:right}

/* 內容
   間距層級：群組內 12px ＜ 標題到內容 18px ＜ 群組之間 34px
   （padding 放在 .inner 而非 .gbody 的 margin，這樣 scrollHeight 才算得進去） */
.gbody{overflow:hidden;transition:max-height .3s ease, opacity .22s}
.grp:not(.open) .gbody{max-height:0 !important;opacity:0}
.gbody .inner{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.grp.gate .gbody .inner{padding-top:24px}   /* 金色緞帶有光暈，要多留一點才不會擠 */

/* 空的「等你決策」＝好消息，要明講 */
.calm{display:flex;align-items:center;gap:11px;padding:14px 20px;border-radius:14px;
  background:var(--surface);border:1px dashed var(--line);color:var(--text-2);font-size:.86rem}
.calm .k{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}

/* ===== 專案列（與 v4 相同）===== */
.row{position:relative;padding-bottom:9px}
.row .hem{position:absolute;left:16px;right:16px;bottom:0;height:22px;border-radius:0 0 18px 18px;opacity:.75}
.row .body{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:18px;padding:16px 20px;display:grid;grid-template-columns:1.25fr 1.35fr auto;gap:18px;align-items:center;transition:.2s}
@media(max-width:980px){.row .body{grid-template-columns:1fr}}
.row.run .body{border-color:var(--aqua);box-shadow:var(--glow)}
.row.gate .body{border-color:var(--gold);box-shadow:var(--glow-gold)}
.row.idle .body{opacity:.78}
.row:hover .body{transform:translateY(-2px)}
.pj{display:flex;align-items:flex-start;gap:12px;min-width:0}
.led{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--text-3)}
.led.a{background:var(--aqua);box-shadow:0 0 12px var(--aqua);animation:pl 1.8s ease-in-out infinite}
.led.g{background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pl 2.4s ease-in-out infinite}
.led.n{background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:.75}
.led.e{background:var(--rose);box-shadow:0 0 12px var(--rose)}
.led.d{background:var(--mint);box-shadow:0 0 10px var(--mint)}
@keyframes pl{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.pj h3{font-size:.98rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj .path{font-size:.7rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;align-items:center;gap:10px;min-width:0}
.ag{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line-soft);border-radius:12px;padding:8px 12px}
.ag .who{font-size:.64rem;font-weight:800;letter-spacing:.14em;margin-bottom:1px}
.ag.c .who{color:var(--aqua)} .ag.x .who{color:var(--violet-hi)}
.ag .task{font-size:.78rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{width:26px;height:2px;border-radius:2px;background:var(--line);flex:none}
.link.on{background:linear-gradient(90deg,var(--aqua),var(--violet))}
.link.off{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.st{display:flex;align-items:center;gap:14px;justify-content:flex-end}
.st .meta{text-align:right;min-width:96px}
.st .meta b{display:block;font-size:.86rem}
.st .meta span{font-size:.7rem;color:var(--text-3)}
.tag{font-size:.66rem;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px;white-space:nowrap}
.tag.run{background:var(--grad-btn);color:#fff}
.tag.gate{background:linear-gradient(115deg,var(--gold),var(--rose));color:#2A1A00}
.tag.idle{background:color-mix(in srgb,var(--text-3) 20%,transparent);color:var(--text-3)}
/* service 有五種狀態、泳道只有三條。tone 保留真實語意，避免跑失敗的專案畫面上寫「閒置」 */
.tag.needs_you{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.tag.error{background:color-mix(in srgb,var(--rose) 24%,transparent);color:var(--rose)}
.tag.done{background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint)}
.pg{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden;margin-top:8px}
.pg i{display:block;height:100%;background:var(--grad-btn);border-radius:2px}

.rail{background:var(--panel);border-left:1px solid var(--line-soft);padding:20px 20px 40px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:16px 18px}
.box h4{margin:0 0 12px;font-size:.8rem;letter-spacing:.1em;color:var(--text-3);font-weight:800}
.cc{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.cc b{font-size:1.9rem;font-weight:800;background:var(--grad-btn);-webkit-background-clip:text;background-clip:text;color:transparent}
.cc span{color:var(--text-3);font-size:.76rem}
.slots{display:flex;gap:6px}
.slot{flex:1;height:7px;border-radius:4px;background:var(--line-soft)}
.slot.f{background:var(--grad-btn);box-shadow:var(--glow)}
.qi{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line-soft);font-size:.8rem;color:var(--text-2)}
.qi:first-of-type{border-top:0}
.qi .n{width:19px;height:19px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.66rem;font-weight:800;color:var(--text-3);flex:none}
.qempty{font-size:.78rem;color:var(--text-3)}
.ccnote{margin:12px 0 0;font-size:.76rem;color:var(--text-3)}
.stat{display:flex;justify-content:space-between;font-size:.8rem;padding:6px 0;color:var(--text-2)}
.stat b{color:var(--text)}

.modebtn{position:fixed;right:20px;bottom:20px;z-index:60;border:0;border-radius:999px;padding:12px 22px;
  font-family:inherit;font-weight:800;font-size:.8rem;color:#fff;background:var(--grad-btn);box-shadow:var(--glow);cursor:pointer}
</style>
</head>
<body>

<div class="app">

  <!-- 側邊欄由 shell.js 提供（六頁共用），這裡不再自己畫一條 -->
  <main class="main">

    <div class="topbar">
      <div><h1>儀表板</h1><div class="sub" id="sub">—</div></div>
      <div class="tools">
        <button class="btn q" onclick="toggleAll(false)">全部收合</button>
        <button class="btn q" onclick="toggleAll(true)">全部展開</button>
        <!-- 這裡本來還有「全部暫停」與「＋ 新專案」兩顆。兩顆都**沒有
             `data-act` 也沒有 `onclick`**，而下面的事件委派只認 `[data-act]`
             ——按下去完全沒有反應。旁邊那兩顆是好的，四顆看起來一模一樣。

             拿掉而不是接上，理由有兩個：
             ① 「全部暫停」屬於佇列那組動作（`queue_pause`），而佇列這一輪
                在凍結區——接它等於把一個凍結的項目拉回來。
             ② 「＋ 新專案」在 shell 的「更多」選單裡已經有一個能用的，
                拿掉它不會少任何功能。

             **一顆按不動的按鈕，比沒有那顆按鈕更糟**：使用者按了沒反應會
             再按一次，然後開始懷疑畫面上其他每一個東西有沒有生效。
             接上排在五節點測試之後，跟佇列那五個控制項一起做。 -->
      </div>
    </div>

    <!-- 星軌泳道 -->
    <div class="sky">
      <div class="hd">
        <b>星軌</b>
        <div class="how">
          <span><i>上下</i>＝狀態</span><span><i>左右</i>＝最後活動（右邊最新）</span>
          <span><i>光環</i>＝已配對</span><span><i>發光脈動</i>＝正在跑</span>
        </div>
      </div>
      <div class="plot" id="plot"></div>
    </div>

    <!-- 分組清單 -->
    <div class="groups" id="groups"></div>
  </main>

  <!-- 右欄全部由 render(data) 產生，沒有寫死的數字 -->
  <aside class="rail">
    <div class="box"><h4>併發狀態</h4>
      <div class="cc"><b id="ccUsed">—</b><span id="ccLimit"></span></div>
      <div class="slots" id="ccSlots"></div>
      <p class="ccnote" id="ccNote"></p>
    </div>
    <div class="box"><h4>佇列</h4><div id="queue"></div></div>
    <div class="box" id="todayBox"><h4>今日</h4><div id="today"></div></div>
    <div class="box" style="padding:0;overflow:hidden"><div class="fabric" style="height:70px;opacity:.75"></div></div>
  </aside>

</div>

<button class="modebtn" id="tg">☀ 切到白天</button>

<!-- QWebChannel：嵌進 QWebEngineView 時由 Qt 從 qrc 供應。
     用瀏覽器單獨開檔案時這行會 404，但無害——下面有 window.qt 守衛，
     沒有 Qt 就直接走示範資料。不要改成 CDN，離線會壞。 -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<!-- 側邊欄與執行控制列在 shell.html，是獨立常駐的 view，不在這一頁裡 -->
<script>
/* ============================================================
   render(data) — 與 dashboard_v4 相同的 schema，v5 只多了 collapsed
   data.collapsed = { gate:false, run:false, idle:true }   ← 記得存使用者偏好
   ============================================================ */
const STAR='M12 0C13.2 8.2 15.8 10.8 24 12 15.8 13.2 13.2 15.8 12 24 10.8 15.8 8.2 13.2 0 12 8.2 10.8 10.8 8.2 12 0Z';
const ORDER=[['gate','等你決策'],['run','執行中'],['idle','閒置']];   // ← 順序就是急迫度
const ANCHORS=[[604800,.12],[259200,.31],[86400,.52],[21600,.70],[3600,.85],[0,.96]];
const GRIDS=[12,31,52,70,85];

function ageToPct(s){
  if(s>=ANCHORS[0][0]) return 6;
  for(let i=0;i<ANCHORS.length-1;i++){
    const [a1,x1]=ANCHORS[i],[a2,x2]=ANCHORS[i+1];
    if(a1>=s&&s>=a2){const t=a1===a2?0:(a1-s)/(a1-a2);return (x1+(x2-x1)*t)*100;}
  }
  return 96;
}

/* ---- 星軌 ---- */
function laneInner(state,ps){
  const stars=ps.filter(p=>p.state===state).map(p=>{
    const pct=ageToPct(p.age_s), side=pct>50?'l':'r';
    const halo=state==='idle'?'':'<span class="halo"></span>';
    const ring=p.paired?'<span class="ring"></span>':'';
    const tips=Object.entries(p.detail||{}).map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('');
    const tone=p.tone||p.state;
    return `<div class="star ${state}${tone==='error'?' error':tone==='done'?' done':''}${p.paired?'':' unpaired'}" style="left:${pct}%" data-focus="${p.id}">
      ${halo}${ring}<span class="core"><svg viewBox="0 0 24 24"><path fill="currentColor" d="${STAR}"/></svg></span>
      <b class="lbl ${side}">${p.name}<small>${p.sub}</small></b>
      <div class="tip"><b>${p.name}</b>${tips}</div></div>`;
  }).join('');
  const cold=state==='idle'?'<span class="coldlabel">冷卻區 · 超過 3 天沒動</span>':'';
  return `<div class="coldzone"></div>${cold}`+
    GRIDS.map(g=>`<div class="gl" style="left:${g}%"></div>`).join('')+
    `<div class="gl now" style="left:96%"></div>`+stars;
}

function rowHTML(p){
  // state 決定落在哪條泳道（三選一）；tone 決定顏色與標籤語意（可以是 error / done）
  const tone=p.tone||p.state;
  const hem=tone==='run'?'fabric-aqua':tone==='gate'?'fabric-gold':'';
  const led={run:'a',gate:'g',error:'e',done:'d',needs_you:'n'}[tone]||'';
  return `<div class="row ${p.state}" id="row-${p.id}">
    <div class="hem fabric ${hem}"></div>
    <div class="body">
      <div class="pj"><span class="led ${led}"></span>
        <div class="nm"><h3>${p.name}</h3><div class="path mono">${p.path}</div>
        ${p.progress!=null?`<div class="pg"><i style="width:${p.progress}%"></i></div>`:''}</div></div>
      <div class="pair">
        <div class="ag c"><div class="who">CLAUDE</div><div class="task">${p.claude}</div></div>
        <span class="link ${p.paired?'on':'off'}"></span>
        <div class="ag x"><div class="who">CODEX</div><div class="task">${p.codex}</div></div></div>
      <div class="st"><div class="meta"><b class="mono">${p.elapsed}</b><span>${p.elapsed_label}</span></div>
        <span class="tag ${tone}">${p.state_label}</span>
        <button class="btn sm ${tone==='gate'?'gold':'q'}" data-act="${p.action}" data-id="${p.id}">${p.action_label}</button></div>
    </div></div>`;
}

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';

function groupSummary(key,items){
  if(key==='gate') return items.length?`最久已等 ${items[0].elapsed}`:'';
  if(key==='run')  return items.length?`併發 ${items.length}/3 · 最久已跑 ${items[0].elapsed}`:'';
  return items.length?`最久 ${items[items.length-1].elapsed} 沒動`:'';
}

let DATA=null;
function render(state){
  const d=typeof state==='string'?JSON.parse(state):state;
  DATA=d;
  document.documentElement.dataset.mode=d.mode||'night';

  // 星軌
  document.getElementById('plot').innerHTML=
    ORDER.map(([k,label])=>
      `<div class="lane-name ${k}"><span class="k"></span>${label}</div>
       <div class="lane ${k}">${laneInner(k,d.projects)}</div>`).join('')+
    `<div class="lane-name axis">時間 →</div><div class="axis">
      ${[[12,'一週前'],[31,'3 天'],[52,'24 小時'],[70,'6 小時'],[85,'1 小時']]
        .map(([x,t])=>`<span class="tk" style="left:${x}%">${t}</span>`).join('')}
      <span class="tk now" style="left:96%">現在</span></div>`;

  // 分組
  const col=d.collapsed||{gate:false,run:false,idle:true};
  document.getElementById('groups').innerHTML=ORDER.map(([k,label])=>{
    const items=d.projects.filter(p=>p.state===k);
    if(!items.length && k!=='gate') return '';            // 空群組隱藏，但 gate 例外
    const open=!col[k];
    const inner=items.length
      ? items.map(rowHTML).join('')
      : `<div class="calm"><span class="k"></span>目前沒有需要你決定的事。</div>`;
    return `<div class="grp ${k}${open?' open':''}" id="grp-${k}">
      <div class="ghd" data-group="${k}">
        ${CHEV}<span class="ttl">${label}</span>
        <span class="cnt">${items.length}</span>
        <span class="sum">${groupSummary(k,items)}</span>
      </div>
      <div class="gbody"><div class="inner">${inner}</div></div>
    </div>`;
  }).join('');
  ORDER.forEach(([k])=>setMax(k));

  const n=s=>d.projects.filter(p=>p.state===s).length;
  document.getElementById('sub').textContent=
    `${d.projects.length} 個專案 · ${n('gate')} 個等你決策 · ${n('run')} 個執行中 · ${n('idle')} 個閒置`;

  paintRail(d);
}

/* 右欄：全部來自 data，沒有寫死的數字
   d.concurrency = { used, limit, note }
   d.queue       = ["notes-app KYC · Codex 測試", ...]
   d.today       = [["完成任務","14"], ["Decision Gate","3"], ...]   ← 沒有真實來源的指標請不要放進來 */
function paintRail(d){
  const cc=d.concurrency||{used:0,limit:0,note:''};
  document.getElementById('ccUsed').textContent=cc.used;
  document.getElementById('ccLimit').textContent=`/ ${cc.limit} 上限`;
  document.getElementById('ccSlots').innerHTML=
    Array.from({length:cc.limit},(_,i)=>`<span class="slot ${i<cc.used?'f':''}"></span>`).join('');
  const free=Math.max(0,cc.limit-cc.used);
  document.getElementById('ccNote').textContent=
    cc.note ?? (free?`還有 ${free} 個空位，佇列會自動遞補。`:'已滿，新任務會排進佇列。');

  const q=d.queue||[];
  document.getElementById('queue').innerHTML= q.length
    ? q.map((t,i)=>`<div class="qi"><span class="n">${i+1}</span>${t}</div>`).join('')
    : `<div class="qempty">佇列是空的。</div>`;

  const t=d.today||[];
  document.getElementById('todayBox').style.display=t.length?'':'none';
  document.getElementById('today').innerHTML=
    t.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
}

function setMax(k){
  const g=document.getElementById('grp-'+k); if(!g) return;
  const b=g.querySelector('.gbody');
  b.style.maxHeight=g.classList.contains('open')?(b.querySelector('.inner').scrollHeight+12)+'px':'0px';
}
function toggleGroup(k){
  const g=document.getElementById('grp-'+k); if(!g) return;
  g.classList.toggle('open'); setMax(k);
  if(bridge) bridge.on_action('collapse:'+k, g.classList.contains('open')?'0':'1');
}
function toggleAll(open){
  ORDER.forEach(([k])=>{
    const g=document.getElementById('grp-'+k); if(!g) return;
    g.classList.toggle('open',open); setMax(k);
  });
}
/* 新的決策進來時：自動展開並閃兩下 —— 絕不能讓它藏在收合的群組裡 */
function alertGate(){
  const g=document.getElementById('grp-gate'); if(!g) return;
  if(!g.classList.contains('open')){ g.classList.add('open'); setMax('gate'); }
  g.classList.add('flash'); setTimeout(()=>g.classList.remove('flash'),2400);
}
function focusRow(id){
  const el=document.getElementById('row-'+id); if(!el) return;
  const grp=el.closest('.grp');
  if(grp && !grp.classList.contains('open')){ grp.classList.add('open'); setMax(grp.id.replace('grp-','')); }
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),120);
}

/* 事件委派 —— 不用 inline onclick。
   實測過：HTML 實體跳脫擋得住文字位置與屬性位置，但擋不住 inline handler 裡的
   JS 字串，因為 HTML parser 會先把 &#39; 解碼回 ' 才輪到 JS 解析。
   規則簡單化：任何 ${} 都不進 onclick，不要去判斷哪個值可信。 */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){ act(b.dataset.act, b.dataset.id||''); return; }
  const g=e.target.closest('.ghd[data-group]');
  if(g){ toggleGroup(g.dataset.group); return; }
  const s=e.target.closest('.star[data-focus]');
  if(s) focusRow(s.dataset.focus);
});

let bridge=null;
function act(kind,id){ bridge?bridge.on_action(kind,id):console.log('demo',kind,id); }
if(window.qt&&qt.webChannelTransport){
  new QWebChannel(qt.webChannelTransport,ch=>{bridge=ch.objects.bridge;
    bridge.stateChanged.connect(render); bridge.gateArrived&&bridge.gateArrived.connect(alertGate); bridge.ready();});
}
document.getElementById('tg').onclick=()=>{
  const h=document.documentElement;
  h.dataset.mode=h.dataset.mode==='night'?'day':'night';
  document.getElementById('tg').textContent=h.dataset.mode==='night'?'☀ 切到白天':'☾ 切到夜空';
  ORDER.forEach(([k])=>setMax(k));
  if(bridge) bridge.on_action('mode',h.dataset.mode);
};
window.addEventListener('resize',()=>ORDER.forEach(([k])=>setMax(k)));
