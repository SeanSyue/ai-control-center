<!DOCTYPE html>
<html lang="zh-Hant" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICC — 登入與安裝</title>
<link rel="stylesheet" href="aicc.css">
<style>
.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.body{overflow-y:auto;padding:24px 30px 30px}

/* ── 一行一個 provider ──────────────────────────────────────────
   規格（`回覆給頁面設計-11.md`）：「一行一個 provider，一個結論加一個動作」。
   掃到幾份、在哪個路徑、哪個版本——**預設全部不顯示**，那些不幫他做
   「我現在能不能按開始執行」這個決定。 */
.pv{display:grid;grid-template-columns:auto 1fr auto;gap:0 16px;align-items:center;
    padding:18px 20px;border-top:1px solid var(--line-soft)}
.pv:first-child{border-top:0}
@media(max-width:760px){.pv{grid-template-columns:auto 1fr;gap:10px 14px}
                        .pv .act{grid-column:1/-1;justify-content:flex-start}}

/* 狀態點。顏色語彙是既有的，這裡一個新的都沒有加：
     薄荷＝完成　金＝需要你動作　玫瑰＝真的壞了　虛線＝推測出來的 */
.pv .dot{width:11px;height:11px;border-radius:50%;flex:none}
.pv.ok        .dot{background:var(--mint)}
/* ⛔ 這裡 2026-08-27 之前是 `animation:pulse`，**而那違反一條已經寫下的定案**：
   `DECISIONS.md`「脈動在這個產品裡已經有主人（`concept_v1.html`：
   **脈動＝正在執行**）。『在等你回答』那個狀態不准也用脈動——
   同一個動作在同一頁上講兩件事。」

   老闆 2026-08-27 自己講得最清楚：「想要呼吸或脈動不就是要提醒這個 node
   正在運行嗎?」——**對，所以「沒登入」不能借它。**

   而且脈動暗示「這裡有事在動」，**「沒登入」是一個靜止的事實**：
   它什麼都沒在做，它只是在那裡等你。
   金色本身已經是「需要你動作」，脈動加上去沒有多講任何事。 */
.pv.signedout .dot{background:var(--gold)}
.pv.missing   .dot{background:var(--gold)}
.pv.broken    .dot{background:var(--rose)}
/* 「問不出來」：**不是綠燈，也不是紅燈**。虛線是這一頁唯一用得上它的地方
   ——AICC 當它是好的，而那是推的，不是量到的。 */
.pv.unknown   .dot{background:transparent;border:1.5px dashed var(--text-3)}
/* `@keyframes pulse` 2026-08-27 一起拿掉——這一頁沒有「正在執行」那種狀態，
   所以它沒有任何合法的用途。留著的話下一個人會拿它去標別的東西，
   而**脈動的意思在這個產品裡已經定了**。 */

.pv .who b{display:block;font-size:.9rem;font-weight:800}
.pv .who span.d{display:block;font-size:.78rem;color:var(--text-2);margin-top:3px}
.pv.unknown .who span.d{color:var(--text-3);border-bottom:1px dashed var(--text-3);
                        padding-bottom:1px;display:inline-block}
.pv .act{display:flex;gap:8px;align-items:center;justify-content:flex-end}

/* 展開的那一段：只有「找不到」與「跑不起來」才有東西可展 */
.more{grid-column:1/-1;margin-top:14px;padding:16px 18px;border-radius:14px;
      background:var(--surface2);border:1px solid var(--line-soft);font-size:.79rem;
      color:var(--text-2);line-height:1.75}
.more h4{font-size:.78rem;color:var(--text-3);font-weight:800;margin-bottom:6px;
         letter-spacing:.04em}
.more h4:not(:first-child){margin-top:16px}
.more ul{list-style:none;margin:0}
.more li{color:var(--text-3);font-size:.76rem}
.cmd{display:block;margin-top:7px;padding:9px 12px;border-radius:10px;
     background:var(--bg);border:1px solid var(--line);
     font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;
     color:var(--aqua-hi);white-space:pre-wrap;word-break:break-all}
.more .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.more .hint{font-size:.73rem;color:var(--text-3);line-height:1.6}

/* 為什麼要他自己跑。**不是免責聲明，是讓他敢按的必要資訊。** */
.why{margin-top:8px;font-size:.75rem;color:var(--text-3);line-height:1.7}

.note{margin-top:22px;padding:18px 20px;border-radius:16px;
      background:var(--surface);border:1px solid var(--line-soft)}
.note h3{font-size:.86rem;margin-bottom:8px}
.note p{font-size:.79rem;color:var(--text-2);line-height:1.8;margin-bottom:10px}
.note p:last-child{margin-bottom:0}
.note b{color:var(--text)}

.empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:.82rem;line-height:1.9}
.stamp{font-size:.74rem;color:var(--text-3);margin-left:auto}
</style>
</head>
<body>

<div class="page">

  <div class="top">
    <h1>登入與安裝</h1>
    <div class="lead">這一頁只回答一件事：<b>AICC 現在按得下「開始執行」嗎？</b></div>
    <div class="bar">
      <!-- 這顆是**快的那一顆**。引擎那一側有兩顆，成本差一個數量級：
             `diag.recheck`      「重新檢查」   重跑上面這些檢查（約 1.1 秒）
             `diag.scan_machine` 「掃描這台機器…」找出所有不在 PATH 上的副本（幾秒）
           原生對話框自己的提示寫著前者「比『掃描這台機器…』快得多」，而
           登入完成後那句指示也是「回到這裡按『重新檢查』」——所以這一頁只放它。
           那顆慢的還沒搬過來（它在原生端是 QInputDialog，網頁沒有等價物），
           見交接文件的待決清單。 -->
      <button class="btn q sm" data-act="recheck" id="scanbtn">重新檢查</button>
      <span class="stamp" id="stamp"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="body" id="body"></div>
  </div>

</div>

<button class="modebtn" id="tg">☀ 切到白天</button>

<!-- QWebChannel：嵌進 QWebEngineView 時由 Qt 從 qrc 供應。
     用瀏覽器單獨開檔案時這行會 404，但無害——下面有 window.qt 守衛。
     不要改成 CDN，離線會壞。 -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
/* ============================================================
   render(data) / 動作一律 bridge.on_action(kind, payload)

   ⛔ 這一頁**沒有、也不准有**一個貼 API key 的欄位。

   `回覆給頁面設計-11.md` 最後一節寫著「API key 欄位要畫，這一輪就畫」
   ——**那一節已經過期了**，老闆 2026-08-24 推翻它（「CODEX 和 CLAUDE
   那邊基本上先做以會員優先」）。引擎那一側跟著改完了：
   `services/credential_entry.py` **沒有任何一個函式收得下一把 key**，
   而註解寫明那是刻意的形狀，不是紀律——「收得下就代表某一天會有人存它」。

   他推翻的理由不是省事，值得原樣留著：
   **那一格存在的每一天，都在教使用者「把憑證交給 AICC 是正常的」。**

   查過兩支 CLI 自己的 `--help`（不是照文件抄）：只有 Codex 有
   `login --with-api-key` 那種「交出去就忘掉」的路；Claude 那邊是
   `ANTHROPIC_API_KEY` 或 `apiKeyHelper`，**兩條都要求有人一直握著那把 key**。
   所以「兩邊都放一格」從一開始就做不到對稱。

   要開那條路**先問老闆**（`NEXT_STEPS.md` 第 6 條逐字這樣寫）。
   ============================================================ */

/* 實際狀態：只有 Python 真的推過來的 key 才會存在。
   **不要在這裡放預設值**——這一頁的全部工作就是誠實回報環境，
   而一個自己編出來的預設值，看起來跟量到的一模一樣。 */
let S = { mode:'night' };
let HAS_BRIDGE = false;
let OPEN = -1;               /* 哪一列展開了 */
let SCANNING = false;        /* 慢的那一顆（掃描整台機器）在跑 */

/* 五種狀態。前四種是 `回覆給頁面設計-11.md` 訂的，第五種是 2026-08-25 加的。

   **第五種為什麼要存在**：`startup_diagnostics._signed_in()` 回的是三態
   `True／False／None`，`None` 的意思是「問不出來」（那支 CLI 把子指令改名了，
   或探測本身失敗）。它一路被小心保留到 `routes_for_signed_out()`，
   然後在 `_cli_check()` **被丟掉**——`if signed is False:` 沒中，就落到
   `Level.OK` 加一個版本號。

   於是畫面上它跟「真的登入了」長得一模一樣，而 `_signed_in()` 的 docstring
   寫著這個函式存在的理由正是「`--version` 跑得好好的、清單全綠、然後每一次
   執行都死在中間」。**「問不出來」重現了同一個綠燈。**

   引擎今天推不出這個值（`test_a_cli_whose_login_state_cannot_be_read_is_not_called_signed_out`
   釘住 `Level.OK`，而那個「不要指控他沒登入」的理由是對的）。
   中間那條路是：照樣不擋、不指控，但**話要說出來**。
   畫面這一側先備好，推得出來的那天就會顯示。 */
const STATE_CLASS = {
  ok:'ok', signed_out:'signedout', not_runnable:'broken',
  missing:'missing', unknown:'unknown',
};

/* 哪幾種擋著他。**這份清單是唯一真相**，下面的結論句與檢查都讀它，
   不要在別的地方再數一次——數兩次的那天，兩邊會不一樣。 */
const BLOCKING = ['signed_out', 'missing', 'not_runnable'];

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 單獨用瀏覽器開檔案檢視設計時才套用；有 bridge 時完全不碰。
   **這裡一個像憑證的字串都沒有，連假的都沒有。** */
const DEMO_S = {
  setup:{
    scanning:false, checked_at:'剛剛',
    providers:[
      { key:'claude', name:'Claude Code', state:'signed_out',
        detail:'2.1.226，但尚未登入',
        action_label:'帶我去登入',
        typed:'claude.cmd setup-token',
        why:'它會開瀏覽器讓你用自己的帳號同意。AICC 不代跑——一個能替你登入的程式，就是一個握得住你帳號的程式。' },
      { key:'codex', name:'Codex CLI', state:'ok',
        detail:'codex-cli 0.147.0' },
    ],
  },
};

function providerHTML(p,i){
  const cls = STATE_CLASS[p.state] || 'unknown';
  const open = OPEN===i;

  /* 動作。**每一種狀態只給一個主要動作**——兩顆等重的按鈕等於沒有建議。 */
  let act = '';
  if(p.state==='signed_out')
    act = '<button class="btn sm" data-act="login" data-p="' + esc(p.key) + '">'
        + esc(p.action_label||'帶我去登入') + '</button>';
  else if(p.state==='missing' || p.state==='not_runnable')
    act = '<button class="btn q sm" data-open="' + i + '">'
        + (open?'收起來':'怎麼辦') + '</button>';
  else if(p.state==='ok')
    act = '<span class="tick" style="color:var(--mint);font-weight:800;font-size:.95rem">✓</span>';

  /* 展開的那一段。**「找不到」不可以是句點**——一顆「選擇檔案」按鈕如果不告訴人
     要找什麼、去哪找，只是把死路換了個位置。 */
  let more = '';
  if(open){
    const bits = [];
    if(p.fix) bits.push('<div>' + esc(p.fix) + '</div>');
    if(p.searched && p.searched.length)
      bits.push('<h4>我們找過這些地方</h4><ul>'
        + p.searched.map(function(x){ return '<li>· ' + esc(x) + '</li>'; }).join('')
        + '</ul>');
    if(p.install_command)
      bits.push('<h4>還沒安裝？</h4><span class="cmd">' + esc(p.install_command) + '</span>'
        + '<div class="row"><button class="btn q sm" data-act="install" data-p="'
        + esc(p.key) + '">開終端機幫我跑</button></div>');
    /* 最後這一段是三段裡最重要的一段：**他的機器自己知道答案，而我們永遠猜不完
       所有安裝方式。**告訴他怎麼問自己的電腦，比我們多列十個路徑有用。 */
    /* 「掃描這台機器…」放在「你指給我看」**之前**，不是放在頂上那一排。

       原生對話框把它擺在底部，那是因為原生版沒有逐列展開的地方可以放。
       這一頁有，而這一格的標題正好就是它要回答的那一句
       ——「已經裝了但我們沒找到？」

       兩步的順序是刻意的：**先讓機器自己再翻一遍，翻不到才要他動手。**
       倒過來的話，我們是在他還沒用完自己的辦法之前就把工作丟給他。

       它跟旁邊那顆的成本差一個數量級（幾秒 vs 約 1.1 秒），所以自己一個
       進行中狀態（`setup.scanning`），而且掃的時候兩顆都按不下去。 */
    if(p.can_pick_path)
      bits.push('<h4>已經裝了但我們沒找到？</h4>'
        + '<div class="row"><button class="btn q sm" data-act="scan" data-p="'
        + esc(p.key) + '"' + (SCANNING ? ' disabled' : '')
        + '>' + (SCANNING ? '掃描中…' : '掃描這台機器…') + '</button>'
        + '<span class="hint">把整台機器翻一遍，包含不在 PATH 上的副本。需要幾秒鐘。</span></div>'
        + '<div style="margin-top:14px">' + esc(p.how_to_find||'') + '</div>'
        + '<div class="row"><button class="btn q sm" data-act="pick_path" data-p="'
        + esc(p.key) + '">選擇位置…</button></div>');
    /* 一句都沒有的時候不畫空盒子——空盒子讀起來像「載入中」。 */
    if(bits.length) more = '<div class="more">' + bits.join('') + '</div>';
  }

  /* 那行可以自己複製去終端機貼的指令，只在「沒登入」時出現：
     按鈕壞掉的時候他還有一條路，而那條路不需要 AICC。 */
  const typed = (p.state==='signed_out' && p.typed)
    ? '<span class="cmd">' + esc(p.typed) + '</span>' : '';
  const why = (p.state==='signed_out' && p.why)
    ? '<div class="why">' + esc(p.why) + '</div>' : '';

  return '<div class="pv ' + cls + '" data-state="' + esc(p.state) + '">'
    + '<span class="dot"></span>'
    + '<div class="who"><b>' + esc(p.name||p.key) + '</b>'
    + '<span class="d">' + esc(p.detail) + '</span>' + typed + why + '</div>'
    + '<div class="act">' + act + '</div>'
    + more
    + '</div>';
}

function paint(){
  const setup = S.setup;
  const body  = document.getElementById('body');
  const btn   = document.getElementById('scanbtn');
  const stamp = document.getElementById('stamp');

  /* 沒推 `setup` → 不畫、不編。**這一頁編一個「都正常」出來的代價，
     正好是它存在的理由。** */
  if(!setup || !setup.providers){
    body.innerHTML = '<div class="empty">還沒有收到這台機器的檢查結果。<br>'
      + '按上面的「重新檢查」。</div>';
    /* ⚠️ 這一行**在跑起來的 App 裡沒有人聽得到**。`web_panel.py` 沒有覆寫
       `javaScriptConsoleMessage`，實測連 stderr 都到不了（`false_greens.json`
       的 FG27，狀態「在別人手上」）。它今天只在 `verify_pages.py` 那種
       離線載入的情境看得到。

       **所以真正在做事的是上面那段畫在螢幕上的字，不是這一行。**
       留著是為了 FG27 修好的那天；不要再往這裡加任何「靠 console 才發現」
       的自我偵測——那等於裝一個不會響的警報。 */
    if(HAS_BRIDGE)
      console.warn('[credentials] Python 沒有推 setup —— 這一頁不編一個「都正常」出來');
    btn.disabled = false; btn.textContent = '重新檢查';
    stamp.textContent = '';
    return;
  }

  /* 4.7 秒。**按下去沒反應的按鈕會被按第二次，而第二次會再花 4.7 秒。** */
  /* 兩顆按鈕、兩個成本、**兩個旗標**。合成一個的話，慢的那顆在跑的時候
     快的那顆會寫著「檢查中…」——而它根本沒有在跑。 */
  SCANNING = !!setup.scanning;
  btn.disabled = SCANNING || !!setup.rechecking;
  btn.textContent = setup.rechecking ? '檢查中…' : '重新檢查';
  stamp.textContent = setup.checked_at ? ('上次檢查：' + setup.checked_at) : '';

  const rows = setup.providers.map(providerHTML).join('');

  /* 結論那一句。**它講的是「能不能開始」，不是「有幾個綠燈」**——
     使用者問的是前者，而數綠燈是我們自己的方便。 */
  const blocked = setup.providers.filter(function(p){
    return BLOCKING.indexOf(p.state) !== -1; });
  const verdict = blocked.length===0
    ? '<div class="note" id="verdict"><h3>可以開始了</h3>'
      + '<p>兩支都跑得動。上面沒有需要你動作的東西。</p></div>'
    : '<div class="note" id="verdict"><h3>還差 ' + blocked.length + ' 件</h3>'
      + '<p>上面標成金色或粉色的那幾列處理完，「開始執行」就按得下去了。'
      + '<b>現在按下去的話，會在跑到一半的時候死在 CLI 那一步</b>——'
      + '而那個訊息會藏在執行紀錄裡，不會出現在你眼前。</p></div>';

  body.innerHTML = '<div class="card">' + rows + '</div>'
    + verdict
    + '<div class="note">'
    + '<h3>AICC 一把憑證都不碰</h3>'
    + '<p>「帶我去登入」只是<b>把那支 CLI 開起來</b>：瀏覽器是它開的、同意是你自己在'
    + '瀏覽器裡點的、憑證進的是它自己的保管處。<b>AICC 從頭到尾看不到，也沒有存。</b></p>'
    + '<p>所以這裡沒有「AICC 帳號」這種東西，也沒有地方可以填帳號密碼——'
    + '你登入的是 Claude 和 OpenAI，不是 AICC。</p>'
    + '</div>'
    + '<div class="note">'
    + '<h3>桌面版登入了，不代表這裡就登入了</h3>'
    + '<p>這是兩家廠商的設計差異，不是 AICC 的選擇：<b>Codex</b> 桌面版與指令列共用同一份'
    + '登入，所以通常會自動通；<b>Claude</b> 不共用——連桌面版自己帶的那一份指令列'
    + '也是登出的。</p>'
    + '<p>上面那顆按鈕做的是 <b>Claude Code 指令列自己的登入</b>，跟你桌面版有沒有登入無關。</p>'
    + '</div>';
}

/* ── 動作 ────────────────────────────────────────────────────── */
let bridge = null;
function act(k,a){
  bridge ? bridge.on_action(k, a===undefined?'':String(a)) : console.log('demo',k,a);
}

document.addEventListener('click', function(e){
  const o = e.target.closest('[data-open]');
  if(o){ const i=+o.dataset.open; OPEN = (OPEN===i ? -1 : i); return paint(); }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const kind = b.dataset.act;
  if(kind==='scan'){
    /* 慢的那一顆。同樣先樂觀變成「掃描中…」，Python 推回來的值會蓋掉它。 */
    if(S.setup) S.setup.scanning = true;
    paint();
    return act('setup_scan', b.dataset.p);
  }
  if(kind==='recheck'){
    /* 樂觀地先變成「檢查中」。Python 推回來的值會蓋掉它——
       包含「推回來還是 false」那一種，那時它會彈回去，而**那是對的**：
       彈回去代表那一下沒有真的開始，比一顆假裝在轉的按鈕誠實。 */
    if(S.setup) S.setup.rechecking = true;
    paint();
    return act('setup_recheck');
  }
  return act('setup_' + kind, b.dataset.p);
});

function render(state){
  const d = typeof state==='string' ? JSON.parse(state) : state;
  S = {...S, ...d};
  document.documentElement.dataset.mode = S.mode || 'night';
  paint();
}

if(window.qt && qt.webChannelTransport){
  new QWebChannel(qt.webChannelTransport, function(ch){
    bridge = ch.objects.bridge; HAS_BRIDGE = true;
    bridge.stateChanged.connect(render);
    bridge.ready();
  });
} else {
  S = {...S, ...DEMO_S};
}

document.getElementById('tg').onclick = function(){
  const h = document.documentElement;
  h.dataset.mode = h.dataset.mode==='night' ? 'day' : 'night';
  document.getElementById('tg').textContent =
    h.dataset.mode==='night' ? '☀ 切到白天' : '☾ 切到夜空';
  if(bridge) bridge.on_action('mode', h.dataset.mode);
};

paint();
</script>
</body>
</html>
